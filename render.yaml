# Render Blueprint — single web service that serves the API + the built React app.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: ritik-karak-portfolio
    runtime: node
    plan: free
    buildCommand: npm install --prefix client --include=dev && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # paste your MongoDB Atlas connection string in the dashboard
      - key: CLIENT_URL
        sync: false   # e.g. https://your-domain.com (used for CORS)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        value: rockykarak0@gmail.com
